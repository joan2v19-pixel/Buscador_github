<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscador de usuarios de GitHub — try / catch / finally</title>

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <!-- ==========================================================
       CONTENEDOR PRINCIPAL
       ========================================================== -->
  <main class="container">

    <!-- Encabezado -->
    <header class="cabecera">
      <h1>Buscador de usuarios de GitHub</h1>
      <p class="subtitulo">Ejercicio de try / catch / finally con fetch</p>
    </header>

    <!-- Fila de búsqueda -->
    <section class="buscador">
      <label class="visually-hidden" for="username">Nombre de usuario de GitHub</label>

      <div class="barra-busqueda">
        <input
          id="username"
          type="text"
          placeholder="ej. octocat"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="buscar" type="button">Buscar</button>
      </div>

      <p id="loading" class="loading oculto" role="status">
        Cargando información<span class="puntos"><span>.</span><span>.</span><span>.</span></span>
      </p>
    </section>

    <!-- Caja de error (aria-live + role alert) -->
    <div id="error" class="error oculto" role="alert" aria-live="polite"></div>

    <!-- Tarjeta con los datos del usuario -->
    <section id="resultado" class="resultado oculto" aria-live="polite">
      <div class="avatar-marco">
        <img id="avatar" src="" alt="" />
      </div>
      <p id="nombre" class="nombre"></p>
      <p class="fila-repos">
        <span id="repos" class="badge">0</span>
        <span class="repos-texto">repositorios públicos</span>
      </p>
      <a id="perfil" class="perfil" href="#" target="_blank" rel="noopener noreferrer">
        Ver perfil en GitHub →
      </a>
    </section>

    <!-- Consola de eventos: muestra el flujo try / catch / finally -->
    <section class="consola" aria-label="Consola de eventos">
      <div class="consola-barra" aria-hidden="true">
        <span class="punto punto--rojo"></span>
        <span class="punto punto--amarillo"></span>
        <span class="punto punto--verde"></span>
      </div>
      <div id="log" aria-live="polite">Consola de eventos (para ver el flujo del try/catch)...</div>
    </section>

  </main>

  <!-- JavaScript al final del body: el DOM ya existe cuando se ejecuta -->
  <script src="js/app.js"></script>
</body>
</html>
